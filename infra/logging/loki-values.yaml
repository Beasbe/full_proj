# Loki (single-binary): хранилище логов, собираемых Fluent Bit.
# Установка: helm install loki oci://ghcr.io/grafana/helm-charts/loki -n logging --create-namespace -f infra/logging/loki-values.yaml
# API: http://loki.logging.svc.cluster.local:3100
deploymentMode: SingleBinary

# SingleBinary: явно отключаем simple-scalable таргеты и лишние компоненты
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Минимальный профиль: без canary, gateway, ruler и memcached-кэшей
lokiCanary:
  enabled: false
gateway:
  enabled: false
ruler:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
test:
  enabled: false

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: 'filesystem'
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        index:
          prefix: loki_index_
          period: 24h
        object_store: filesystem
        schema: v13

# Отключаем sidecar правил (не нужен без ruler)
sidecar:
  rules:
    enabled: false

singleBinary:
  replicas: 1
  persistence:
    # Без PVC контейнер не может писать в /var/loki (read-only rootfs)
    enabled: true
    size: 2Gi
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "384Mi"
      cpu: "500m"
