name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy-server:
    runs-on: server

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        run: |
          docker build \
            --network host \
            -t ghcr.io/beasbe/full_proj/backend:${{ github.sha }} \
            -t ghcr.io/beasbe/full_proj/backend:latest \
            ./CMS

      - name: Push backend
        run: |
          docker push ghcr.io/beasbe/full_proj/backend:${{ github.sha }}
          docker push ghcr.io/beasbe/full_proj/backend:latest

      - name: Build frontend
        run: |
          docker build \
            --network host \
            --build-arg NEXT_PUBLIC_API_URL=http://81.177.48.158:8080 \
            -t ghcr.io/beasbe/full_proj/frontend:${{ github.sha }} \
            -t ghcr.io/beasbe/full_proj/frontend:latest \
            ./It_project

      - name: Push frontend
        run: |
          docker push ghcr.io/beasbe/full_proj/frontend:${{ github.sha }}
          docker push ghcr.io/beasbe/full_proj/frontend:latest

      - name: Deploy with Helm
        run: |
          helm upgrade --install full-proj ~/full_proj/helm \
            --namespace full-proj \
            --set image.tag=${{ github.sha }}

      - name: Wait backend
        run: |
          kubectl rollout status deployment/backend -n full-proj --timeout=300s

      - name: Run migrations
        run: |
          kubectl exec -n full-proj \
            $(kubectl get pod -n full-proj -l app=backend -o jsonpath='{.items[0].metadata.name}') \
            -c backend \
            -- php artisan migrate --force

      - name: Publish filament assets
        run: |
          kubectl exec -n full-proj \
            $(kubectl get pod -n full-proj -l app=backend -o jsonpath='{.items[0].metadata.name}') \
            -c backend \
            -- php artisan filament:assets

      - name: Cleanup Docker
        run: |
          docker image prune -af
