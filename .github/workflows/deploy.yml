name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: server

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        run: |
          docker build \
            --network host \
            -t ghcr.io/beasbe/full_proj/backend:${{ github.sha }} \
            -t ghcr.io/beasbe/full_proj/backend:latest \
            ./CMS

          docker push ghcr.io/beasbe/full_proj/backend:${{ github.sha }}
          docker push ghcr.io/beasbe/full_proj/backend:latest

      - name: Build & Push Frontend
        run: |
          docker build \
            --network host \
            --build-arg NEXT_PUBLIC_API_URL=http://81.177.48.158:8080 \
            -t ghcr.io/beasbe/full_proj/frontend:${{ github.sha }} \
            -t ghcr.io/beasbe/full_proj/frontend:latest \
            ./It_project

          docker push ghcr.io/beasbe/full_proj/frontend:${{ github.sha }}
          docker push ghcr.io/beasbe/full_proj/frontend:latest

      - name: Deploy
        run: |
          helm upgrade --install full-proj ./helm \
            --namespace full-proj \
            --create-namespace \
            --set image.tag=${{ github.sha }} \
            --wait \
            --timeout 10m

      - name: Wait Backend
        run: |
          kubectl rollout status deployment/backend -n full-proj --timeout=300s

      - name: Migrate DB
        run: |
          POD=$(kubectl get pods -n full-proj -l app=backend -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n full-proj "$POD" -c backend -- php artisan migrate --force

      - name: Publish Filament Assets
        run: |
          POD=$(kubectl get pods -n full-proj -l app=backend -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n full-proj "$POD" -c backend -- php artisan filament:assets

      - name: Cleanup Docker
        run: |
          docker image prune -af
