name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy-server:
    runs-on: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and push backend
        run: |
          docker build \
            --network host \
            -t localhost:5000/backend:${{ github.sha }} ./CMS
          docker push localhost:5000/backend:${{ github.sha }}

      - name: Build and push frontend
        run: |
          docker build \
            --network host \
            --build-arg NEXT_PUBLIC_API_URL=http://81.177.48.158:8080 \
            -t localhost:5000/frontend:${{ github.sha }} ./It_project
          docker push localhost:5000/frontend:${{ github.sha }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install full-proj ~/full_proj/helm \
            --namespace full-proj \
            --set image.tag=${{ github.sha }} \
            --timeout 10m \
            --cleanup-on-fail \
            --atomic

      - name: Run migrations
        run: |
          kubectl exec -n full-proj \
            $(kubectl get pod -n full-proj -l app=backend \
              --field-selector=status.phase=Running \
              -o jsonpath='{.items[0].metadata.name}') \
            -c backend \
            -- php artisan migrate --force

      - name: Publish filament assets
        run: |
          kubectl exec -n full-proj \
            $(kubectl get pod -n full-proj -l app=backend \
              --field-selector=status.phase=Running \
              -o jsonpath='{.items[0].metadata.name}') \
            -c backend \
            -- php artisan filament:assets
