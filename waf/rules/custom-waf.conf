# =============================================================================
#  REQUEST-899-CUSTOM-WAF.conf
#
#  The file name makes it load *before* the OWASP Core Rule Set
#  (setup.conf includes /etc/modsecurity.d/owasp-crs/rules/*.conf in
#  alphabetical order, and "REQUEST-899" sorts before "REQUEST-901...").
#  Loading first means our blocks are evaluated and logged before CRS, which
#  makes it easy to demonstrate that the *custom* rules are the ones firing.
#
#  It is mounted into the WAF container at:
#     /opt/owasp-crs/rules/REQUEST-899-CUSTOM-WAF.conf
#
#  NOTE on the variant's second feature (L7 DDoS on static resources):
#  it is implemented in the Nginx layer of the WAF, see
#     waf/nginx/default.conf.template  (limit_req_zone + limit_req -> HTTP 429)
#  A pure ModSecurity collection-based counter was evaluated first, but
#  ModSecurity v3 (as shipped in owasp/modsecurity-crs) does not persist
#  per-IP collections between requests/workers, so such a rule never fires.
#  See waf/SPEC.md ("Design decisions") for the full rationale.
# =============================================================================

# -----------------------------------------------------------------------------
#  Custom rule: blocking of known vulnerability scanners and botnets
#  by characteristic User-Agent patterns.
#
#  The pattern list is externalised in scanners-botnets.data and matched as a
#  case-insensitive substring list (PmFromFile after t:lowercase).
# -----------------------------------------------------------------------------
SecRule REQUEST_HEADERS:User-Agent "@pmFromFile /opt/owasp-crs/rules/scanners-botnets.data" \
    "id:1000001,\
    phase:1,\
    t:lowercase,\
    deny,\
    status:403,\
    log,\
    msg:'Blocked: known vulnerability scanner / botnet User-Agent',\
    severity:'CRITICAL',\
    tag:'custom-waf',\
    tag:'scanner-detection',\
    ver:'lab-custom-rules/1.0'"
