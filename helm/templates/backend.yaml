apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      # Аннотации для сбора метрик Prometheus (nginx-prometheus-exporter sidecar)
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: copy-public
          image: {{ .Values.registry }}/backend:{{ .Values.image.tag }}
          command:
            - sh
            - -c
            - |
              cp -r /var/www/html/public/. /mnt/public/
              ln -sfn /var/www/html/storage/app/public /mnt/public/storage
          volumeMounts:
            - name: public-files
              mountPath: /mnt/public

      containers:
        - name: backend
          image: {{ .Values.registry }}/backend:{{ .Values.image.tag }}
          ports:
            - containerPort: 9000
          resources:
            requests:
              memory: {{ .Values.backend.resources.requests.memory }}
              cpu: {{ .Values.backend.resources.requests.cpu }}
            limits:
              memory: {{ .Values.backend.resources.limits.memory }}
              cpu: {{ .Values.backend.resources.limits.cpu }}
          env:
            - name: APP_ENV
              value: {{ .Values.backend.env.APP_ENV }}
            - name: APP_DEBUG
              value: {{ .Values.backend.env.APP_DEBUG | quote }}
            - name: DB_HOST
              value: {{ .Values.backend.env.DB_HOST }}
            - name: DB_PORT
              value: {{ .Values.backend.env.DB_PORT | quote }}
            - name: DB_DATABASE
              value: {{ .Values.backend.env.DB_DATABASE }}
            - name: DB_USERNAME
              value: {{ .Values.backend.env.DB_USERNAME }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: APP_KEY
            - name: APP_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: APP_URL
            - name: MAIL_MAILER
              value: smtp
            - name: MAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_HOST
            - name: MAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_PORT
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_USER
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_PASS
            - name: MAIL_FROM_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_FROM
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.backend.env.CORS_ALLOWED_ORIGINS | quote }}
          volumeMounts:
            - name: public-files
              mountPath: /var/www/html/public
            - name: laravel-storage
              mountPath: /var/www/html/storage/app/public

        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
            - name: public-files
              mountPath: /var/www/html/public
            - name: laravel-storage
              mountPath: /var/www/html/storage/app/public

        # Экспортёр метрик nginx (stub_status) для Prometheus
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.4.0
          args:
            - -nginx.scrape-uri=http://127.0.0.1/stub_status
          ports:
            - containerPort: 9113
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"

      volumes:
        - name: public-files
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: laravel-storage
          persistentVolumeClaim:
            claimName: storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: backend
  ports:
    - name: fpm
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 80
  # Внешний доступ только через Gateway API -> WAF (Service waf).
  # NodePort у nginx убран, чтобы трафик не мог обойти WAF.
  type: ClusterIP
