{{- /* Доступ к приложению через Kubernetes Gateway API.
     GatewayClass — cluster-scoped, создаётся отдельно (infra/gateway-api/gatewayclass.yaml). */ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.listenerPort }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: full-proj-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: http
  rules:
    # Весь HTTP-трафик -> Service waf (WAF - обязательная точка входа),
    # далее WAF реверс-проксирует на Service nginx -> php-fpm.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: waf
          port: {{ .Values.waf.port }}
