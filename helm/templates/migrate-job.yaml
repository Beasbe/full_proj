apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-{{ .Release.Revision }}
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-mysql
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL..."
              until nc -z mysql 3306; do
                echo "MySQL not ready, retrying in 3s..."
                sleep 3
              done
              echo "MySQL is ready!"
      containers:
        - name: migrate
          image: {{ .Values.registry }}/backend:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              php artisan migrate --force
              php artisan filament:assets
              php artisan livewire:publish --assets
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: APP_ENV
              value: {{ .Values.backend.env.APP_ENV }}
            - name: APP_DEBUG
              value: {{ .Values.backend.env.APP_DEBUG | quote }}
            - name: DB_HOST
              value: {{ .Values.backend.env.DB_HOST }}
            - name: DB_PORT
              value: {{ .Values.backend.env.DB_PORT | quote }}
            - name: DB_DATABASE
              value: {{ .Values.backend.env.DB_DATABASE }}
            - name: DB_USERNAME
              value: {{ .Values.backend.env.DB_USERNAME }}
