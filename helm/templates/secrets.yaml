apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  APP_KEY: {{ .Values.secrets.APP_KEY | quote }}
  APP_URL: {{ .Values.secrets.APP_URL | quote }}
  DB_PASSWORD: {{ .Values.secrets.DB_PASSWORD | quote }}
  SMTP_HOST: {{ .Values.secrets.SMTP_HOST | quote }}
  SMTP_PORT: {{ .Values.secrets.SMTP_PORT | quote }}
  SMTP_USER: {{ .Values.secrets.SMTP_USER | quote }}
  SMTP_PASS: {{ .Values.secrets.SMTP_PASS | quote }}
  SMTP_FROM: {{ .Values.secrets.SMTP_FROM | quote }}
  TO_EMAIL: {{ .Values.secrets.TO_EMAIL | quote }}
  DB_ROOT_PASSWORD: {{ .Values.secrets.DB_ROOT_PASSWORD | quote }}
