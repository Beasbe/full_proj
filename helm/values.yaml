# Registry с образами. При переносе репозитория на новый GitHub замените
# на ghcr.io/<новый-org>/<новый-repo> или переопределите в CI:
#   --set registry=ghcr.io/${{ github.repository }}
registry: ghcr.io/YOUR_ORG/YOUR_REPO
image:
  tag: latest

namespace: full-proj

backend:
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  port: 9000
  env:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: laravel_dev
    DB_USERNAME: laravel

frontend:
  replicas: 1
  port: 3000
  nodePort: 30560
  # Адрес API бэкенда. NEXT_PUBLIC_API_URL вшивается во фронтенд на этапе
  # сборки образа (см. CI), это значение - переопределение для рантайма.
  apiUrl: "http://localhost:8080"

nginx:
  replicas: 1
  port: 80
  nodePort: 30080

mysql:
  replicas: 1
  port: 3306
  database: laravel_dev
  storage: 1Gi

secrets:
  APP_KEY: ""
  DB_PASSWORD: ""
  SMTP_HOST: ""
  SMTP_PORT: ""
  SMTP_USER: ""
  SMTP_PASS: ""
  SMTP_FROM: ""
  TO_EMAIL: ""
  DB_ROOT_PASSWORD: ""
